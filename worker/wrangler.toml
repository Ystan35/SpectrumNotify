name = "spectrum-notify-worker"
main = "src/index.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["*/10 * * * *"]

[vars]
# Where push messages go. Create a topic by opening the ntfy app / subscribing to it first.
NTFY_URL = "https://ntfy.sh"
NTFY_TOPIC = "spectrum-CHANGE-ME"
# Moodle calls are limited to these functions, whatever token is stored.
ALLOWED_WS = "core_webservice_get_site_info,core_enrol_get_users_courses,core_course_get_contents,mod_forum_get_forums_by_courses,mod_forum_get_forum_discussions,message_popup_get_popup_notifications,core_calendar_get_action_events_by_timesort,core_calendar_get_calendar_upcoming_view"

[[kv_namespaces]]
binding = "STATE"
id = "b7c5af1addb541ad90ea38cac993ffc2"
