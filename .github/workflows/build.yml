name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  HAS_TOKEN: ${{ secrets.GH_PAT != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug + release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace
      - name: Stage release APK into repo (apk/SpectrumNotify.apk)
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/SpectrumNotify.apk
          git add apk/SpectrumNotify.apk
      - name: Sync latest.json with version in build.gradle.kts
        run: |
          CODE=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          printf '{"versionCode": %s, "versionName": "%s", "notes": ""}
' "$CODE" "$NAME" > latest.json
          if ! git diff --quiet latest.json apk/SpectrumNotify.apk; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add latest.json apk/SpectrumNotify.apk
            git commit -m "Publish $NAME ($CODE): latest.json + APK"
          fi
      - name: Push latest.json + APK (token auth)
        if: env.HAS_TOKEN == 'true'
        run: git push https://${{ secrets.GH_PAT }}@github.com/Ystan35/SpectrumNotify.git HEAD:main || echo "push skipped"
      - uses: actions/upload-artifact@v4
        with:
          name: SpectrumNotify-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
